<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>¿Quieres ser mi Valentín?</title>
        <style>
            body {
                text-align: center;
                font-family: Arial sans-serif;
                margin-top: 50px;

                background: linear-gradient(-45deg, #6a0dad, #8a2be2, #9370db, #4b0082);
                background-size: 400% 400%;
                animation: fondoMorado 8s ease infinite;
            }

            button{
                font-size: 20px;
                padding: 10px 25px;
                margin: 10px;
                cursor: pointer;
            }
            @keyframes fondoMorado{
                0%{
                    background-position: 0% 50%;
                }
                50%{
                    background-position: 100% 50%;
                }
                100%{
                    background-position: 0% 50%;
                }
            }
            
        </style>
    </head>
    <body>
        <h1 id="texto">¿Quieres ser mi Valentín? 💘</h1>
        <img id="imagen" src="img1.jpg" width="250">

        <button id="btnsi">Sí</button>
        <button id="btnno">No </button>
        <script>
            const btnsi = document.getElementById("btnsi");
            const btnno = document.getElementById("btnno");
            const imagen = document.getElementById("imagen");
            const texto = document.getElementById("texto");
            

            let tamaño = 20;
            let contador = 0;

            const frases = [
                "¿Quieres ser mi Valentín? 💘",
                "Ño? 🥺",
                "Andale piensalo 🥹",
                "Andale andale ♥️",
                "Porfavor se mi Valentín 🥺",
                "Andale te ruegooo 😭",
                "Porfas 🥺♥️",
                "No vas a cambiar de opinion? 🥺💔",
                "Me rompes el corazon 🥺💔😭",
                "No quieres aceptar? 🥺",
                "Andale vamos se mi Valentín 💘",
                "Estas segura que no quieres? 🥺♥️",
                "Muy muy segura? 🥺💘",
                "Te dejo pensarlo 🥺",
                "Tres",
                "Dos",
                "Uno",
                "Lo siento...",
                "Me obligaste a obligarte 😔",
            ]
            
            const totalimagenes = 10;

            function moverbotonno(){
                const ancho = window.innerWidth - btnno.offsetWidth;
                const alto = window.innerHeight - btnno.offsetHeight;

                const x = Math.random() * ancho;
                const y = Math.random() * alto;

                btnno.style.left = x + "px";
                btnno.style.left = y + "px";
            }

            btnno.onclick = () => {
                tamaño += 10;
                btnsi.style.fontSize = tamaño + "px";

                contador++;
                if (contador >= frases.length) {
                    contador = frases.length - 1;
                }

                texto.textContent = frases[contador];

                let indiceimagen = contador;
                if (indiceimagen >= totalimagenes) {
                    indiceimagen = totalimagenes - 1;
                }
                imagen.src = "img" + (indiceimagen +1) + ".jpg";

                if (contador === frases.length - 1) {
                    btnno.style.position = "absolute";
                }
                btnno.addEventListener("touchstart" , (e) => {
                    if (contador === frases.length -1) {
                        e.preventDefault();
                        moverbotonno();
                    }
                    });
                    
                

            };
            btnno.onmouseenter = () => {
                if (contador === frases.length - 1){
                    moverbotonno();
                }
            };
            btnsi.onclick = ()  => {
                document.body.innerHTML = `
                <div style="
                text-align: center;
                margin-top: 80px;
                font-family: Arial, sans-serif;
                color: white;
                ">
                <h1> 💝Sabia que aceptarias 💘 </h1>
                <p> Me hablas para ponernos de acuerdo que haremos el 14 bebe💝 </p>
                <img src="img11.jpg" width="300">
                </div>
                `;

            }
        </script>
    </body>
</html>
